<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Radar des Sorties — parcourez votre playlist Spotify et écoutez des previews via Deezer." />
<meta name="theme-color" content="#121212" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎧</text></svg>" />
<title>Radar des Sorties</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-top">
      <h1>🎧 Radar des Sorties</h1>
      <div class="header-actions">
        <input id="search" class="search-input" type="search" placeholder="Filtrer par titre ou artiste…" aria-label="Filtrer les morceaux" />
        <button id="generate-playlists" class="btn btn-primary">Générer les playlists</button>
        <a id="login-link" class="btn btn-ghost" href="/login" hidden>Se connecter à Spotify</a>
      </div>
    </div>
    <div id="loader" class="loader" hidden>
      <span class="spinner" aria-hidden="true"></span>
      <span class="loader-text">Génération en cours…</span>
    </div>
    <div id="result" class="result" role="status"></div>
  </header>

  <main>
    <div id="grid" class="grid" aria-live="polite"></div>
    <p id="empty-state" class="empty-state" hidden>Aucun morceau ne correspond à votre recherche.</p>
  </main>

  <div id="player" class="player">
    <img id="player-cover" src="" alt="" />
    <div class="player-info">
      <div id="player-title" class="player-title"></div>
      <div id="player-artist" class="player-artist"></div>
    </div>
    <button id="player-toggle" class="player-toggle" aria-label="Lecture / pause">▶</button>
    <input id="volume" class="volume-slider" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Volume" />
    <div class="audio-container">
      <audio id="audio" preload="none"></audio>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
